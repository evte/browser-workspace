services:
  browser:
    build: .
    ports:
      - "${BROWSER_BIND_ADDRESS:-127.0.0.1}:${BROWSER_PORT:-8000}:8000"
    environment:
      ACCESS_PASSWORD: ${ACCESS_PASSWORD:?Set ACCESS_PASSWORD in .env}
    volumes:
      - browser_data:/data
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    init: true
    tmpfs:
      - /run/browser-gateways:mode=0755,size=16m
    shm_size: '1gb'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/session', timeout=5)); assert isinstance(r.get('setup_required'), bool)"]
      interval: 10s
      timeout: 6s
      start_period: 20s
      retries: 12
volumes:
  browser_data:
